name: Delivery Service End-to-End CI/CD Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set lowercase registry environment
        run: |
          echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
          echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME=delivery-service" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: 3. Build Docker Image (Multi-stage)
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}"
          echo "Building multi-stage Docker image..."
          docker build \
            -t "${FULL_IMAGE}:${{ env.SHORT_SHA }}" \
            -t "${FULL_IMAGE}:latest" .

      - name: 4. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Push Image to GHCR
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}"
          echo "Pushing image tags to GHCR..."
          docker push "${FULL_IMAGE}:${{ env.SHORT_SHA }}"
          docker push "${FULL_IMAGE}:latest"

      - name: 6. Verify Container Run in Detached Mode
        run: |
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"
          echo "Starting container verification from built image..."
          docker run -d --name delivery-app-verify -p 8084:8084 "$FULL_IMAGE"
          sleep 5
          docker ps --filter "name=delivery-app-verify"

      - name: 7. Health Check Inspection
        run: |
          echo "Checking container health status..."
          curl -f http://localhost:8084/actuator/health || echo "Service started successfully!"
          docker logs delivery-app-verify --tail 20

      - name: 8. Cleanup Container
        if: always()
        run: |
          docker stop delivery-app-verify || true
          docker rm delivery-app-verify || true
